<!DOCTYPE html>
<html lang="pt-br">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Login | Cinéfilo</title>

 <link rel="stylesheet" href="css/index.css">
</head>

<body>

 <main>

 <section class="login">

 <h1>Cinéfilo</h1>

 <p>
 Entre na sua conta para continuar sua jornada cinematográfica.
 </p>

 <form id="form-login">

 <div class="campo-login">

 <label for="email">
 E-mail
 </label>

 <input
 type="email"
 id="email"
 placeholder="Digite seu e-mail"
 required
 >

 </div>

 <div class="campo-login">

 <label for="senha">
 Senha
 </label>

 <input
 type="password"
 id="senha"
 placeholder="Digite sua senha"
 required
 >

 </div>

 <button type="submit" id="btn-entrar">
 Entrar
 </button>

 <p id="mensagem-login"></p>

 </form>

 <p><a href="index.html">Voltar ao catálogo</a></p>

 <div class="cadastro">

 <p>
 Ainda não possui uma conta?
 </p>

 <a href="cadastro.html">
 Criar conta
 </a>

 </div>

 </section>

 </main>

 <script src="js/login.js"></script><script src="js/tema.js"></script>
</body>



</html>
