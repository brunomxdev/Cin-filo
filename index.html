<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinéfilo - Filmes, Animes & Séries</title>
  <link rel="stylesheet" href="css/index.css"><link rel="stylesheet" href="footer.css">
</head>
<body>

  <!-- Menu de Navegação -->
  <header class="topoMenu">
    <h1> Cinéfilo</h1>
    <nav>
      <ul>
        <li><a href="#catalogo">Filmes</a></li>
        <li><a href="#animes">Animes</a></li>
        <li><a href="#series">Séries</a></li>
        <li><a href="lancamentos.html">Lançamentos</a></li>
        <li><a href="desafios.html">Desafios</a></li>
        <li><a href="curadoria-ia.html">Curadoria IA</a></li>
        <li><a href="diario.html">Diário</a></li>
        <li><a href="estatisticas.html">Estatísticas</a></li>
        <li><a href="login.html">Entrar</a></li>
        <li><a href="cadastro.html">Criar conta</a></li>
      </ul>
    </nav>
  </header>

  <!-- Banner Destaques -->
  <div class="bannerIndex">
    <div class="trilha" id="trilha"></div>
    <button class="button" id="btn-avaliar-banner">+ Avaliar no Diário</button>
    <button class="seta esq" id="anterior" aria-label="Anterior">‹</button>
    <button class="seta dir" id="proximo" aria-label="Próximo">›</button>
    <div class="bolinhas" id="bolinhas"></div>
  </div>

  <main class="container">

    <!-- FILMES -->
    <section id="catalogo">
      <div class="cabecalho-acao">
        <h2 class="titulo-secao"> Filmes em Destaque</h2>
      </div>

      <div class="barra-filtros">
        <input type="text" id="busca-input" placeholder="Buscar filmes por título ou diretor...">
        <select id="filtro-genero"><option value="">Todos os Gêneros</option></select>
      </div>

      <div class="trilho-horizontal" id="trilho-filmes"></div>
    </section>

    <!-- ANIMES -->
    <section id="animes">
      <div class="cabecalho-acao">
        <h2 class="titulo-secao"> Top 12 Animes</h2>
      </div>
      <div class="trilho-horizontal" id="trilho-animes"></div>
    </section>

    <!-- SÉRIES -->
    <section id="series">
      <div class="cabecalho-acao">
        <h2 class="titulo-secao"> Top 12 Séries</h2>
      </div>
      <div class="trilho-horizontal" id="trilho-series"></div>
    </section>

</main>


  <!-- MODAL: AVALIAR NO DIÁRIO -->
  <div class="modal-overlay" id="modal-avaliar">
    <div class="modal">
      <button class="fechar-modal">&times;</button>
      <h3>Registrar Assistido no Diário</h3>

      <div class="form-grupo">
        <label for="select-filme">Selecione a Obra:</label>
        <select id="select-filme"></select>
      </div>

      <div class="form-grupo">
        <label for="input-nota">Sua Nota (0 a 10):</label>
        <input type="number" id="input-nota" min="0" max="10" step="0.5" value="9.5">
      </div>

      <div class="form-grupo">
        <label for="input-data">Data de Visualização:</label>
        <input type="date" id="input-data">
      </div>

      <div class="form-grupo">
        <label for="input-comentario">Seu Comentário / Review:</label>
        <textarea id="input-comentario" rows="3" placeholder="O que achou desta obra?"></textarea>
      </div>

      <button class="btn-submit" id="btn-salvar-diario">Salvar no Diário</button>
    </div>
  </div>

  <!-- MODAL: DETALHES -->
  <div class="modal-overlay" id="modal-detalhes">
    <div class="modal">
      <button class="fechar-modal">&times;</button>
      <div id="conteudo-detalhes"></div>
    </div>
  </div>
<script src="js/footer.js" defer></script>
  <script src="js/index.js"></script>
  <script src="js/tema.js"></script>
</body>
</html>
